services:
  - type: web
    name: essiq
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AUTH_DATABASE_PATH
        value: /tmp/essiq_auth.sqlite3
      - key: COOKIE_SECURE
        value: "true"
      - key: OPEN_CHARGE_MAP_API_KEY
        sync: false
